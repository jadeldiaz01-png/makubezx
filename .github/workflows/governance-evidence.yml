name: governance-evidence

on:
  pull_request:
    paths:
      - ".github/pull_request_template.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "governance/**"
      - "evidence/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pinned schema validator
        run: python -m pip install "jsonschema[format-nongpl]==4.26.0"
      - name: Validate immutable workflow references
        run: python repo_agent_platform/tools/validate_workflows.py
      - name: Validate governance artifacts and ledger cases
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker
          from jsonschema.exceptions import ValidationError

          required_paths = [
              Path(".github/pull_request_template.md"),
              Path(".github/ISSUE_TEMPLATE/change-proposal.yml"),
              Path("governance/CHANGE_POLICY.md"),
              Path("governance/RISK_CLASSIFICATION.md"),
              Path("evidence/ledger.schema.json"),
          ]
          missing = [str(path) for path in required_paths if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing governance artifacts: {missing}")

          schema = json.loads(Path("evidence/ledger.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          required_fields = {
              "id", "timestamp", "change_ref", "commit_sha", "risk_level",
              "decision", "evidence", "rollback", "approver",
          }
          if set(schema.get("required", [])) != required_fields:
              raise SystemExit("Evidence Ledger required fields mismatch")
          if schema["properties"]["risk_level"]["enum"] != ["R0", "R1", "R2", "R3", "R4"]:
              raise SystemExit("Risk levels are not canonical")
          if schema["properties"]["decision"]["enum"] != ["GO", "CONDITIONAL_GO", "NO_GO"]:
              raise SystemExit("Decision values are not canonical")

          valid = {
              "id": "EV-20260725-PR9",
              "timestamp": "2026-07-25T12:00:00Z",
              "change_ref": "PR-9",
              "commit_sha": "e" * 40,
              "risk_level": "R1",
              "decision": "CONDITIONAL_GO",
              "evidence": [{"type": "ci", "uri": "github://run/1", "sha256": "a" * 64}],
              "rollback": "Close or revert PR 9",
              "approver": "human-reviewer",
          }
          validator.validate(valid)

          invalid_cases = []
          for field in sorted(required_fields):
              case = copy.deepcopy(valid)
              del case[field]
              invalid_cases.append((f"missing-{field}", case))

          invalid_cases.extend([
              ("invalid-risk", {**valid, "risk_level": "R9"}),
              ("invalid-decision", {**valid, "decision": "AUTO_GO"}),
              ("empty-evidence", {**valid, "evidence": []}),
              ("invalid-id", {**valid, "id": "invalid"}),
              ("invalid-timestamp", {**valid, "timestamp": "not-a-date"}),
              ("invalid-commit", {**valid, "commit_sha": "deadbeef"}),
              ("extra-property", {**valid, "unapproved": True}),
              ("invalid-evidence-hash", {
                  **valid,
                  "evidence": [{"type": "ci", "uri": "github://run/1", "sha256": "bad"}],
              }),
              ("extra-evidence-property", {
                  **valid,
                  "evidence": [{
                      "type": "ci",
                      "uri": "github://run/1",
                      "sha256": "a" * 64,
                      "secret": "must-not-pass",
                  }],
              }),
          ])

          for name, case in invalid_cases:
              try:
                  validator.validate(case)
              except ValidationError:
                  continue
              raise SystemExit(f"Negative ledger case unexpectedly passed: {name}")

          print("Draft 2020-12 schema and positive/negative ledger cases validated")
          PY
