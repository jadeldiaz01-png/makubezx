name: temporary-contract-format

on:
  pull_request:
    paths:
      - "repo_agent_platform/contracts/**"
      - "repo_agent_platform/tests/test_enterprise_contracts.py"
      - ".github/workflows/temporary-contract-format.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-contract-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned formatter
        run: python -m pip install "ruff==0.15.22"
      - name: Format contract files
        run: |
          python -m ruff format \
            repo_agent_platform/contracts/models.py \
            repo_agent_platform/contracts/__init__.py \
            repo_agent_platform/tests/test_enterprise_contracts.py
      - name: Verify formatter idempotence
        run: |
          python -m ruff format --check \
            repo_agent_platform/contracts/models.py \
            repo_agent_platform/contracts/__init__.py \
            repo_agent_platform/tests/test_enterprise_contracts.py
      - name: Upload formatted contract files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-contract-files
          path: |
            repo_agent_platform/contracts/models.py
            repo_agent_platform/contracts/__init__.py
            repo_agent_platform/tests/test_enterprise_contracts.py
          if-no-files-found: error
          retention-days: 1
