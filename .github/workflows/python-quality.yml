name: python-quality

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements-dev.lock"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Upgrade installer
        run: python -m pip install --upgrade "pip==26.1.1"
      - name: Install exact direct tool pins
        run: python -m pip install -r requirements-dev.lock
      - name: Validate immutable workflow references
        run: python repo_agent_platform/tools/validate_workflows.py
      - name: Lint
        run: python -m ruff check .
      - name: Format changed Python files
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- "*.py"
          )
          if ((${#changed_python[@]})); then
            python -m ruff format --check "${changed_python[@]}"
          else
            echo "No Python files changed; format gate is not applicable."
          fi
      - name: Type-check changed Python files
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- "*.py"
          )
          if ((${#changed_python[@]})); then
            python -m mypy "${changed_python[@]}"
          else
            echo "No Python files changed; type gate is not applicable."
          fi
      - name: Unit tests and conditional coverage
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- "*.py"
          )
          if ((${#changed_python[@]})); then
            python -m pytest
          else
            python -m pytest -o addopts="-ra --strict-config --strict-markers"
          fi
      - name: Static security scan for changed Python files
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- "*.py"
          )
          if ((${#changed_python[@]})); then
            python -m bandit -c pyproject.toml "${changed_python[@]}"
          else
            echo "No Python files changed; Bandit gate is not applicable."
          fi
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-dev.lock --strict
