name: temporary-mypy-diagnostics

on:
  pull_request:
    paths:
      - "repo_agent_platform/contracts/**"
      - "repo_agent_platform/tests/test_enterprise_contracts.py"
      - ".github/workflows/temporary-mypy-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-mypy-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned type checker
        run: python -m pip install "mypy==2.3.0"
      - name: Capture strict mypy report
        shell: bash
        run: |
          python -m mypy \
            repo_agent_platform/contracts/models.py \
            repo_agent_platform/contracts/__init__.py \
            repo_agent_platform/tests/test_enterprise_contracts.py \
            > mypy-report.txt 2>&1 || true
          test -s mypy-report.txt
      - name: Upload mypy diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mypy-diagnostics
          path: mypy-report.txt
          if-no-files-found: error
          retention-days: 1
