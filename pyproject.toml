[project]
name = "makubezx"
version = "0.1.0"
description = "Experimental agent-platform foundation"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["repo_agent_platform/generated"]

[tool.ruff.lint]
# Initial adoption gate: block syntax/runtime defects and high-confidence security
# findings across the existing codebase. Broader style families are introduced in
# later incremental PRs after the inherited baseline is normalized.
select = ["E9", "F63", "F7", "F82", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["repo_agent_platform/generated"]

[[tool.mypy.overrides]]
module = "repo_agent_platform.contracts.models"
# mypy 2.3 does not infer that every runtime subclass of ContractMixin is a dataclass.
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "repo_agent_platform.tests.test_enterprise_contracts"
# Two negative tests intentionally construct heterogeneous keyword dictionaries.
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["repo_agent_platform/tests"]
addopts = "-ra --strict-config --strict-markers --cov=repo_agent_platform --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["repo_agent_platform"]
omit = ["repo_agent_platform/generated/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["repo_agent_platform/tests", "repo_agent_platform/generated"]
