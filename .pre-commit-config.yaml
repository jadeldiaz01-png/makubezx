minimum_pre_commit_version: "4.6.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
        pass_filenames: false
        args: ["."]
      - id: ruff-format
        name: ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]
        pass_filenames: false
        args: ["."]
      - id: mypy
        name: mypy strict
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["repo_agent_platform"]
      - id: pytest
        name: pytest with coverage
        entry: python -m pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: bandit
        name: bandit security scan
        entry: python -m bandit -c pyproject.toml -r repo_agent_platform
        language: system
        pass_filenames: false
